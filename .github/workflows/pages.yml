name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-data.mjs && node scripts/check-journey.mjs
      - run: mkdir _site && cp -r index.html style.css app.js lines.js journey.js data assets _site/ && rm -rf _site/assets/source
      # Pages caches files for 10 min: stamp code/data URLs with the commit so a new page never runs stale scripts
      - name: Cache-bust code and data
        run: |
          V=${GITHUB_SHA::8}
          sed -i -E "s/(href=\"style\.css|src=\"app\.js)\"/\1?v=$V\"/" _site/index.html
          sed -i -E "s#'\./(lines|journey|config)\.js'#'./\1.js?v=$V'#; s#data/[$][{]f[}][.]json#data/\${f}.json?v=$V#" _site/*.js
          grep -q "app.js?v=$V" _site/index.html && grep -q "journey.js?v=$V" _site/app.js && grep -q "json?v=$V" _site/app.js
      - name: Write config.js from secret
        env:
          ION_TOKEN: ${{ secrets.CESIUM_ION_TOKEN }}
        run: printf "export const ION_TOKEN = '%s';\n" "$ION_TOKEN" > _site/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>London Rail 3D</title>
  <meta name="description" content="Interactive 3D map of London's Underground, Overground, Elizabeth line, DLR, Trams and National Rail over real terrain.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
</head>
<body>
  <div id="map"></div>

  <aside id="panel" aria-label="Map layers">
    <header class="brand">
      <span class="roundel" aria-hidden="true"><i></i></span>
      <h1>London Rail 3D</h1>
      <button id="collapse" class="icon" aria-expanded="true" aria-controls="panel-body" title="Hide layers">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
      </button>
    </header>
    <div id="panel-body">
      <section class="trains">
        <label class="switch"><input type="checkbox" id="t-trains"><span>Trains</span></label>
        <div class="speed" role="radiogroup" aria-label="Train speed">
          <label><input type="radio" name="speed" value="1"><span>1×</span></label>
          <label><input type="radio" name="speed" value="10" checked><span>10×</span></label>
          <label><input type="radio" name="speed" value="60"><span>60×</span></label>
        </div>
      </section>
      <section class="toggles">
        <label class="switch"><input type="checkbox" id="t-zones" checked><span>Fare zones</span></label>
        <label class="switch"><input type="checkbox" id="t-stations" checked><span>Stations</span></label>
        <label class="switch"><input type="checkbox" id="t-terminals" checked><span>Terminal landmarks</span></label>
        <label class="switch"><input type="checkbox" id="t-buildings"><span>3D buildings</span></label>
        <label class="switch"><input type="checkbox" id="t-underground"><span>See underground</span></label>
      </section>
      <div id="key"></div>
      <p class="note">Track from OpenStreetMap; stations and zones from TfL. Tunnel depths are indicative and zone boundaries approximate.</p>
    </div>
  </aside>

  <article id="card" hidden aria-live="polite">
    <button class="icon close" id="card-close" title="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2"/></svg>
    </button>
    <h2 id="card-name"></h2>
    <p id="card-zone"></p>
    <ul id="card-lines"></ul>
  </article>

  <div id="loading" role="status">Loading the network…</div>
  <script type="module" src="app.js"></script>
</body>
</html>
